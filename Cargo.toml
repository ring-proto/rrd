[workspace]
resolver = "2"
members = ["ring-core", "ring-sim", "rrd", "rrd-cni", "rrd-agent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ring-proto/rrd"

# Common dependencies are declared once here and referenced from member crates
# with `foo.workspace = true` so versions stay in lockstep across the workspace.
# Single-crate deps (smallvec, socket2, nix, rtnetlink, ratatui, ...) stay local
# to their crate.
[workspace.dependencies]
ring-core = { path = "ring-core" }
tokio = { version = "1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
