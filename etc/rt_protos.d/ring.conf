# RING routing daemon protocol tag (DISPLAY ONLY).
#
# The kernel stores RING's route protocol numerically as 155; the daemon installs
# and the demo asserts on `proto 155`, so this file is never required for
# correctness. Installing it (`make install-rtproto`, or copy to
# /etc/iproute2/rt_protos.d/ring.conf) only makes `ip -6 route show` print the
# friendly name `proto ring` in place of `proto 155`.
155	ring
