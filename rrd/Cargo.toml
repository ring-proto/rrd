[package]
name = "rrd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "rrd"
path = "src/main.rs"

[[bin]]
name = "rrdctl"
path = "src/bin/rrdctl.rs"

[dependencies]
ring-core = { workspace = true }
rrd-proto = { path = "../rrd-proto" }
async-trait = "0.1"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "signal", "macros", "io-util", "process"] }
socket2 = { version = "0.5", features = ["all"] }
nix = { version = "0.29", features = ["net", "hostname", "user", "socket"] }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
rtnetlink = "0.21.0"
netlink-packet-route = "0.30.0"
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3"
