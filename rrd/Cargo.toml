[package]
name = "rrd"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rrd"
path = "src/main.rs"

[dependencies]
ring-core = { path = "../ring-core" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "signal", "macros", "io-util"] }
socket2 = { version = "0.5", features = ["all"] }
nix = { version = "0.29", features = ["net", "hostname"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
rtnetlink = "0.21.0"
netlink-packet-route = "0.30.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
